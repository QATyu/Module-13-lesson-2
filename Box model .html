<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal fact file</title>
    <style>
        /* Page background-set te color and font for the whole page */
        body{
            background-color: darkgreen;
            font-family: Arial, sans-serif;
        }
        /* Box model - wrigh sets the content area 
        Paddling pushes the text away from the edges
        Boder draws a visible frame around the fact file
        Margin line pushes the fact file away from the screen edge */
        .fact-file{
            background-color: lightyellow;
            color: darkslategrey;
            width: 260px;
            Padding: 25px;
            border:4px solid forestgreen;
            margin: 30px;
        }
        /* animal name - forstgreen so it  stands out */
        .animal-name{
            color: forestgreen;
            font-size: 22px;
        }
        /* detail row - dark text on the light background */
        .detail{
            color: darklategrey;
        }
        /* cool fact - orange and italic to make it feel special */
        .cool-fact{
            color:darkorange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
    <h2 class:"animal-name">snow leopard</h2>
    <p class:"detail">type: big cat</p>
    <p class:"detail">lives in:mountain ranges of central Asia</p>
    <p class:"detail">diet: deer,goat and wild sheep</p>
    <p class:"cool-fact">cool fact: can leap upto 15m in a single jump</p>

</body>
</html>
